# Front door for the Rails app. Runs unprivileged on 8080 inside the network.

# --- real client IP -----------------------------------------------------------
# Only trust X-Forwarded-For from private ranges (Docker bridge, a reverse
# proxy on the same host). A client connecting from the internet cannot spoof it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# keep the scheme chosen by a trusted TLS-terminating proxy in front of us
map $realip_remote_addr $trusted_hop {
    default 0;
    ~^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.) 1;
}
map "$trusted_hop:$http_x_forwarded_proto" $forwarded_proto {
    "~^1:https$" https;
    default      $scheme;
}

# --- rate limits (the app has its own, stricter, rack-attack rules) -----------
limit_req_status  429;
limit_conn_status 429;

map $request_method $post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $post_key           zone=auth:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream rails {
    server web:3000;
    keepalive 8;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    # request size: 1 MB everywhere, more only where images can be uploaded
    client_max_body_size 1m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;

    limit_req  zone=general burst=60 nodelay;
    limit_conn perip 40;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # compiled assets are baked into this image
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /packs/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # login, sign-up, password reset (POST only)
    location ~ ^/(users(/sign_in|/password)?|api/v1/login)/?$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://rails;
    }

    # places that accept image uploads: article (3 x 5 MB), comment, document
    location ~ ^/(api/v1/)?(articles|comments) {
        client_max_body_size 16m;
        proxy_pass http://rails;
    }

    # uploaded files: never let the browser treat them as a page or script
    location ^~ /rails/active_storage/ {
        proxy_pass http://rails;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        proxy_pass http://rails;
    }
}
